</head>
<body>

    <!-- это момо -->
    <div class="container">
        <h1 class="header">Чат {{ chatName }}</h1>
    
        <div class="content">
            <div class="left">
                <div class="box2">
                    <h3>Список пользователей</h3>
                    <div id="userList">
                        {% if users %}
                            {% for user in users %}
                                <div>{{ user[1] }}</div>
                            {% endfor %}
                        {% else %}
                            <div>Нет пользователей для отображения.</div>
                        {% endif %}
                    </div>
                </div>
            </div>
            <div class="right">
                <div class="box" id="messages">
                   
                </div>
                <div class="input-container">
                    <form id="messageForm">
                        <input type="text" name="message_text" placeholder="Введите текст" id="message" required>
                        <button type="submit" id="sendButton">Отправить</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            // Отправка сообщения
            fetchMessages();
            $('#messageForm').on('submit', function(e) {
                e.preventDefault();  // Предотвращаем стандартное поведение формы
                const messageText = $('#message').val();  // Исправлено на правильный идентификатор
                $.post('/chat/{{ chat_id }}', { message_text: messageText }, function() {
                    $('#message').val('');  // Очищаем поле ввода
                    fetchMessages();  // Обновляем список сообщений
                });
            });
    
            // Функция для получения сообщений
            function fetchMessages() {
                $.get('/chat/{{ chat_id }}/messages', function(data) {
                    $('#messages').empty();  // Очищаем текущие сообщения
                    data.forEach(function(message) {
                        $('#messages').append('<p><strong>User ' + message[2] + ':</strong> ' + message[4] + ' <em>' + new Date(message[1]).toLocaleString() + '</em></p>');
                    });
                });
            }
    
            // Обновление сообщений каждые 2 секунды
            setInterval(fetchMessages, 500);
        });
    </script>
    
</body>
